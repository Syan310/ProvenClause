# N2: the 17 ContractNLI hypotheses for NDAs.
#
# id, name and hypothesis are copied verbatim from the dataset's "labels" field
# (tests check this). The dataset spells nda-2's name "None-inclusion".
#
# guidance is our own wording. The paper does not publish its annotation
# guideline, so it is written from the hypothesis text and from train evidence.
# Tune it only on dev.
#
# risk_label_for_recipient: the label that is worse for the Receiving Party.
# It only orders the report (N5); it does not affect scoring.

- id: nda-1
  name: Explicit identification
  hypothesis: "All Confidential Information shall be expressly identified by the Disclosing Party."
  guidance: >
    Entailment if only information that the Disclosing Party marks, labels or designates
    as confidential (for example in writing, or confirmed in writing after oral disclosure)
    counts as Confidential Information.
    Contradiction if information can be confidential without being marked, for example
    information that is "otherwise designated", reasonably understood to be confidential,
    or confidential by its nature.
    NotMentioned if the contract does not say whether marking is required.
  risk_label_for_recipient: Contradiction

- id: nda-2
  name: None-inclusion of non-technical information
  hypothesis: "Confidential Information shall only include technical information."
  guidance: >
    Entailment if the definition of Confidential Information is limited to technical
    information (for example technical data, software, designs, processes).
    Contradiction if the definition also covers non-technical information such as
    business plans, financial data, customer lists, pricing or marketing information.
    NotMentioned if the contract does not describe what kinds of information are covered.
  risk_label_for_recipient: Contradiction

- id: nda-3
  name: Inclusion of verbally conveyed information
  hypothesis: "Confidential Information may include verbally conveyed information."
  guidance: >
    Entailment if information disclosed orally or verbally can be Confidential Information,
    even when a condition applies (for example written confirmation within 30 days).
    Contradiction if Confidential Information is limited to written, tangible or
    electronic form, so oral information is excluded.
    NotMentioned if the contract does not address the form of disclosure.
  risk_label_for_recipient: Entailment

- id: nda-4
  name: Limited use
  hypothesis: "Receiving Party shall not use any Confidential Information for any purpose other than the purposes stated in Agreement."
  guidance: >
    Entailment if the Receiving Party may use Confidential Information only for the
    purpose stated in the contract.
    Contradiction if the contract lets the Receiving Party use some Confidential
    Information for other purposes, for example a "residuals" clause that allows use
    for any purpose.
    NotMentioned if the contract restricts disclosure but says nothing about use.
  risk_label_for_recipient: Entailment

- id: nda-5
  name: Sharing with employees
  hypothesis: "Receiving Party may share some Confidential Information with some of Receiving Party's employees."
  guidance: >
    Entailment if the Receiving Party may disclose to its employees, even with conditions
    such as need-to-know or written confidentiality undertakings. Disclosure to
    "Representatives" counts when the definition of Representatives includes employees.
    Contradiction if disclosure to anyone, employees included, is forbidden without
    the Disclosing Party's prior consent.
    NotMentioned if employees are not addressed.
  risk_label_for_recipient: Contradiction

- id: nda-7
  name: Sharing with third-parties
  hypothesis: "Receiving Party may share some Confidential Information with some third-parties (including consultants, agents and professional advisors)."
  guidance: >
    Entailment if the Receiving Party may disclose to some persons outside its own
    organization, such as consultants, agents, advisors, lenders or affiliates, even
    with conditions.
    Contradiction if disclosure is limited to the Receiving Party's own employees, or
    disclosure to any third party is forbidden.
    NotMentioned if the contract does not address disclosure to third parties.
  risk_label_for_recipient: Contradiction

- id: nda-8
  name: Notice on compelled disclosure
  hypothesis: "Receiving Party shall notify Disclosing Party in case Receiving Party is required by law, regulation or judicial process to disclose any Confidential Information."
  guidance: >
    Entailment if, when law, regulation, a court order or a subpoena requires disclosure,
    the Receiving Party must notify the Disclosing Party (usually before disclosing,
    unless notice is prohibited by law).
    Contradiction if the contract allows compelled disclosure and says no notice is needed.
    NotMentioned if compelled disclosure is not addressed, or it is allowed without any
    statement about notice.
  risk_label_for_recipient: Entailment

- id: nda-10
  name: Confidentiality of Agreement
  hypothesis: "Receiving Party shall not disclose the fact that Agreement was agreed or negotiated."
  guidance: >
    Entailment if the existence, terms or negotiation of the contract or of the related
    discussions must be kept confidential.
    Contradiction if the contract allows a party to disclose the existence or terms of
    the contract or the relationship.
    NotMentioned if the contract does not address this.
  risk_label_for_recipient: Entailment

- id: nda-11
  name: No reverse engineering
  hypothesis: "Receiving Party shall not reverse engineer any objects which embody Disclosing Party's Confidential Information."
  guidance: >
    Entailment if the Receiving Party must not reverse engineer, decompile, disassemble
    or analyze the composition of materials that contain Confidential Information.
    Contradiction if reverse engineering is expressly allowed, for example when needed
    for the purpose of the contract.
    NotMentioned if reverse engineering is not addressed.
  risk_label_for_recipient: Entailment

- id: nda-12
  name: Permissible development of similar information
  hypothesis: "Receiving Party may independently develop information similar to Confidential Information."
  guidance: >
    Entailment if information that the Receiving Party develops independently (without
    use of Confidential Information) is excluded from the obligations, or the Receiving
    Party is free to develop similar products.
    Contradiction if the contract forbids independent development of similar information.
    NotMentioned if independent development is not addressed.
  risk_label_for_recipient: Contradiction

- id: nda-13
  name: Permissible acquirement of similar information
  hypothesis: "Receiving Party may acquire information similar to Confidential Information from a third party."
  guidance: >
    Entailment if information that the Receiving Party lawfully receives from a third
    party without a duty of confidentiality is excluded from the obligations.
    Contradiction if the contract forbids getting such information from third parties.
    NotMentioned if this is not addressed.
  risk_label_for_recipient: Contradiction

- id: nda-15
  name: No licensing
  hypothesis: "Agreement shall not grant Receiving Party any right to Confidential Information."
  guidance: >
    Entailment if the contract says that it grants no license or other right to the
    Confidential Information, or that the information stays the Disclosing Party's property.
    Contradiction if the contract grants the Receiving Party a license or other right
    to the Confidential Information.
    NotMentioned if rights in the information are not addressed.
  risk_label_for_recipient: Entailment

- id: nda-16
  name: Return of confidential information
  hypothesis: "Receiving Party shall destroy or return some Confidential Information upon the termination of Agreement."
  guidance: >
    Entailment if the Receiving Party must return or destroy Confidential Information
    when the contract or the discussions end. An obligation that applies "upon request
    at any time" also counts.
    Contradiction if the contract says the Receiving Party need not return or destroy
    anything.
    NotMentioned if return or destruction is not addressed.
  risk_label_for_recipient: Entailment

- id: nda-17
  name: Permissible copy
  hypothesis: "Receiving Party may create a copy of some Confidential Information in some circumstances."
  guidance: >
    Entailment if the Receiving Party may make copies in some cases, for example only
    as needed for the purpose, a limited number of copies, or with consent.
    Contradiction if the contract forbids copying or reproduction of Confidential
    Information.
    NotMentioned if copying is not addressed.
  risk_label_for_recipient: Contradiction

- id: nda-18
  name: No solicitation
  hypothesis: "Receiving Party shall not solicit some of Disclosing Party's representatives."
  guidance: >
    Entailment if the Receiving Party must not solicit or hire some of the Disclosing
    Party's employees or other representatives, usually for a stated period.
    Contradiction if the contract expressly allows such solicitation.
    NotMentioned if solicitation is not addressed.
  risk_label_for_recipient: Entailment

- id: nda-19
  name: Survival of obligations
  hypothesis: "Some obligations of Agreement may survive termination of Agreement."
  guidance: >
    Entailment if some obligations continue after the contract ends or is terminated,
    for example confidentiality for a number of years after termination.
    Contradiction if all obligations end when the contract ends or at a fixed date that
    is not after termination.
    NotMentioned if the contract does not say what happens to obligations at termination.
  risk_label_for_recipient: Entailment

- id: nda-20
  name: Permissible post-agreement possession
  hypothesis: "Receiving Party may retain some Confidential Information even after the return or destruction of Confidential Information."
  guidance: >
    Entailment if, after the return or destruction obligation, the Receiving Party may
    keep some information, for example one archival copy, copies required by law, or
    automatic electronic backups.
    Contradiction if the Receiving Party must return or destroy all Confidential
    Information and all copies, with no exception that lets it keep any.
    NotMentioned if return or destruction is not addressed.
  risk_label_for_recipient: Contradiction
