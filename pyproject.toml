[project]
name = "provenclause"
version = "0.1.0"
description = "Evidence-grounded, verifiable contract review agent"
authors = [
    { name = "Syan", email = "yan.shaoy@northeastern.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.36,<4",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25==0.2.2",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls the real DeepSeek API and costs money"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
